services:
  gst-guru:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - gst-data:/data
    # To reach Ollama running on the host from inside Docker, set
    # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 in .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  gst-data:
